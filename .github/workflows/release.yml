name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from history since the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      # A release must not ship code that fails its own suite.
      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
