name: Fixture drift

on:
  workflow_dispatch: {}
  schedule:
    # Keep the replayed fixtures honest: re-record on a fixed cadence and run
    # the suite against the fresh copies so a protocol change shows up even when
    # nobody has touched the records locally.
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          check-latest: true

      # Re-record the standard fixtures against the live testnet. This step is
      # read-only: it never submits anything, and the recorder only needs a
      # public RPC endpoint, so no secrets are required.
      - name: Re-record fixtures
        run: make fixtures

      # Run the suite against the newly recorded fixtures. Failures here mean
      # the stored responses no longer match what the tool produces, which is
      # exactly the drift this workflow is meant to catch.
      - name: Test against fresh fixtures
        run: make test
